on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: live-smoke

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AIRNOW_LIVE_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Require a live API key
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$AIRNOW_API_KEY" || "$AIRNOW_API_KEY" == "test-key" ]]; then
            echo "::error::AIRNOW_API_KEY must contain a live AirNow API key"
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run live API smoke tests
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: Rscript ci/run-live-tests.R
